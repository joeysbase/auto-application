# How Step 3 works through your want-to-apply queue (docs/step3-apply.md §1).
# Copy to config/apply.yaml (git-ignored) and edit; without it these defaults apply.
# Check it with:  uv run auto-app apply policy
workers: 3                      # applications prepared / submitted at once (automated appliers)
pace:
  per_hour: 6                   # at most this many submissions per hour …
  per_day: 20                   # … and per day
  hours: "09:00-18:00"          # submit only in this window (local time)
  per_company_per_month: 3
order: queued                   # queued (the order you chose) | newest_posting | by_filter
appliers:                       # per platform: the chain, tried in order; when one can't, the next takes over
  greenhouse: [greenhouse, agent, simplify, manual]   # agent: the browser agent (docs/step3-agent.md)
  lever:      [agent, lever, simplify, manual]        # lever / ashby: not built yet — skipped for now
  ashby:      [agent, ashby, simplify, manual]
  workday:    [agent, simplify, manual]
  linkedin_easy_apply: [simplify, manual]             # never automated
  "*":        [agent, simplify, manual]               # any other platform
  # simplify_auto (Simplify's autofill driven by the app; `auto-app apply login simplify` once) is still available:
  # name it in a chain to use it, e.g.  "*": [simplify_auto, simplify, manual]
submit:                         # appliers that submit by themselves: review (you press submit) | auto
  greenhouse: review
  lever: review
  ashby: review
auto_drafts: {}                 # auto mode: may Claude-drafted free text be submitted unseen? e.g. {greenhouse: true}
notify: true                    # a desktop notification when something needs you
