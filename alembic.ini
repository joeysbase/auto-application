# Only for generating migrations from the command line:
#   uv run alembic revision --autogenerate -m "describe the change"
# The app applies migrations itself when it opens the database (core/db/engine.py).
[alembic]
script_location = migrations
sqlalchemy.url = sqlite:///data/alembic-scratch.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
